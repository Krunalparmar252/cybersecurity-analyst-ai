# Benchmark Manifest for Phase 3 Public Benchmark Evaluation
# Pinned repositories, language metadata, licenses, commit SHAs, and splits.
# Split "dev": PyGoat, NodeGoat (allowed for inspection and bug fixes)
# Split "test": vulpy, dvpwa, Juice Shop, DVNA (held-out for evaluation reporting)

global_excludes:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/out/**"
  - "**/*.min.js"
  - "**/*.bundle.js"
  - "**/vendor/**"
  - "**/third_party/**"
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/specs/**"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/poetry.lock"
  - "**/Pipfile.lock"
  - "**/.git/**"

repositories:
  - name: pygoat
    url: https://github.com/adeyosemanputra/pygoat.git
    commit: 2aa4cc14f251e4a780e94e200aed6b36a5b15c21
    language: python
    license: MIT
    split: dev
    description: "OWASP PyGoat - Intentionally vulnerable Django web application"

  - name: nodegoat
    url: https://github.com/OWASP/NodeGoat.git
    commit: c5cb68a7084e4ae7dcc60e6a98768720a81841e8
    language: javascript
    license: Apache-2.0
    split: dev
    description: "OWASP NodeGoat - Vulnerable Node.js / Express application"

  - name: vulpy
    url: https://github.com/fportantier/vulpy.git
    commit: 5249cc8b05a1c37f6b2f757b1cf16a509c327122
    language: python
    license: GPL-3.0
    split: test
    description: "Vulpy - Vulnerable web application built with Flask"

  - name: dvpwa
    url: https://github.com/anxolerd/dvpwa.git
    commit: a1d8f89fac2e57093189853c6527c2b01fc1d9c1
    language: python
    license: MIT
    split: test
    description: "Damn Vulnerable Python Web Application (Flask)"

  - name: juice-shop
    url: https://github.com/juice-shop/juice-shop.git
    commit: 717f5efa886b0417eeecb52378b03cf10567b7e2
    language: typescript
    license: MIT
    split: test
    description: "OWASP Juice Shop - Intentionally vulnerable TypeScript/Node.js web application"

  - name: dvna
    url: https://github.com/appsecco/dvna.git
    commit: 9ba473add536f66ac9007966acb2a775dd31277a
    language: javascript
    license: MIT
    split: test
    description: "Damn Vulnerable NodeJS Application (Express/Sequelize)"


# Rule catalogue: metadata for every rule the Detection agent implements.
# Specs:           Document/rules.md
# Implementation:  analyst/detection/engine.py (original rules)
#                  analyst/detection/rules_extra.py (Task 4 rules)
# tests/test_rule_registry.py fails if this list and the code drift apart.
# llm_confirmation mirrors rules.md: unambiguous formats skip LLM confirmation
# only in the spec; in this build every candidate still passes through REASON.
rules:
  - {id: SQLI-001, class: SQL Injection, match: ast, languages: [python, javascript, typescript], module: engine}
  - {id: SQLI-002, class: SQL Injection, match: ast, languages: [python], module: rules_extra, note: "%-format or .format() in execute()/raw(); supersedes SQLI-001 on the same line"}
  - {id: XSS-001, class: Cross-Site Scripting, match: ast, languages: [javascript, typescript], module: rules_extra, note: "dangerouslySetInnerHTML with non-literal, unsanitised value"}
  - {id: XSS-002, class: Cross-Site Scripting, match: ast, languages: [python, javascript, typescript], module: engine}
  - {id: XSS-003, class: Cross-Site Scripting, match: regex, languages: [any-ingested], module: rules_extra, note: "Jinja2 |safe and EJS <%- %> in source files"}
  - {id: AUTH-001, class: Broken Authentication, match: ast, languages: [python], module: rules_extra, note: "password compared with ==/!= instead of a hash-verify call"}
  - {id: AUTH-002, class: Broken Authentication, match: ast, languages: [python], module: rules_extra, note: "md5/sha1 applied to a password"}
  - {id: CMDINJ-001, class: Command Injection, match: ast, languages: [python], module: engine}
  - {id: PATHTRAV-001, class: Path Traversal, match: ast, languages: [python], module: engine}
  - {id: DESER-001, class: Unsafe Deserialization, match: ast, languages: [python], module: engine}
  - {id: DESER-002, class: Unsafe Deserialization, match: ast, languages: [javascript, typescript], module: rules_extra, note: "eval()/Function() with non-literal input"}
  - {id: SECRET-001, class: Hardcoded Secrets, match: regex, languages: [any-ingested], module: rules_extra, redacted: true}
  - {id: SECRET-002, class: Hardcoded Secrets, match: regex, languages: [any-ingested], module: rules_extra, redacted: true}
  - {id: SECRET-003, class: Hardcoded Secrets, match: regex, languages: [any-ingested], module: rules_extra, redacted: true}
  - {id: SECRET-005, class: Hardcoded Secrets, match: regex, languages: [any-ingested], module: engine, redacted: true}
  - {id: SECRET-006, class: Hardcoded Secrets, match: entropy, languages: [any-ingested], module: rules_extra, redacted: true, note: "len>=20, Shannon entropy>=4.0 bits/char"}
  - {id: SECRET-007, class: Hardcoded Secrets, match: regex, languages: [any-ingested], module: rules_extra, note: "header only; key body never echoed. Only fires in ingested source-language files (.pem is not ingested)"}
  - {id: XSS-004, class: Cross-Site Scripting, match: ast, languages: [python], module: rules_extra, note: "Flask render_template_string() called with tainted template string"}
  - {id: AUTH-003, class: Broken Authentication, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "Login/auth route with no rate-limiting decorator/middleware"}
  - {id: AUTH-004, class: Broken Authentication, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "Session cookie set without HttpOnly and/or Secure flags"}
  - {id: SSRF-001, class: Server-Side Request Forgery, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "HTTP client call with user-controlled URL without allowlist validation"}
  - {id: SECRET-004, class: Hardcoded Secrets, match: regex, languages: [any-ingested], module: rules_extra, redacted: true, note: "Hardcoded JWT literal"}
  - {id: SECRET-008, class: Hardcoded Secrets, match: file-pattern, languages: [any-ingested], module: rules_extra, note: ".env file present and tracked in git"}
  - {id: CMDINJ-002, class: Command Injection, match: ast, languages: [javascript, typescript], module: rules_extra, note: "child_process.exec/execSync/spawn with tainted input"}
  - {id: PATHTRAV-002, class: Path Traversal, match: ast, languages: [javascript, typescript], module: rules_extra, note: "fs.readFile/writeFile/res.sendFile with tainted input without path check"}
  - {id: DESER-003, class: Unsafe Deserialization, match: ast, languages: [javascript, typescript], module: rules_extra, note: "node-serialize unserialize, unsafe yaml.load, vm.runInContext"}
  - {id: AUTH-005, class: Broken Authentication, match: ast, languages: [javascript, typescript], module: rules_extra, note: "password compared with ==/=== instead of bcrypt/argon2 compare"}
  - {id: AUTH-006, class: Broken Authentication, match: ast, languages: [javascript, typescript], module: rules_extra, note: "crypto.createHash('md5'|'sha1') applied to password value"}
  - {id: REDIR-001, class: Open Redirect, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "redirect()/res.redirect with tainted URL and no allowlist"}
  - {id: CRYPTO-001, class: Insecure Cryptography, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "md5/sha1 hash on security tokens or signatures"}
  - {id: CRYPTO-002, class: Insecure Cryptography, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "weak cipher or mode: DES, RC4, AES-ECB"}
  - {id: CRYPTO-003, class: Insecure Cryptography, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "insecure pseudo-random generator for secrets, tokens, or sessions"}
  - {id: TLS-001, class: Insecure TLS Configuration, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "TLS certificate verification disabled (verify=False, rejectUnauthorized:false)"}
  - {id: CONFIG-001, class: Security Misconfiguration, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "debug mode enabled in production code (debug=True, env=development)"}
  - {id: CONFIG-002, class: Broken Authentication, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "cookie set without secure or httponly flags"}
  - {id: JWT-001, class: Insecure Authentication, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "JWT verification disabled, algorithm none, or unverified decode"}
  - {id: CORS-001, class: CORS Misconfiguration, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "wildcard origin Access-Control-Allow-Origin: * combined with credentials: true"}
  - {id: XXE-001, class: XML External Entity, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "unsafe XML parsing without defusedxml or with entity expansion"}
  - {id: SSTI-001, class: Server-Side Template Injection, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "server-side template injection via tainted template string"}
  - {id: ZIPSLIP-001, class: Path Traversal, match: ast, languages: [python, javascript, typescript], module: rules_extra, note: "unsafe archive extraction (extractall, extractAllTo) without member path check"}
# Specified in rules.md but NOT implemented (listed so the gap is explicit).
not_implemented: []
